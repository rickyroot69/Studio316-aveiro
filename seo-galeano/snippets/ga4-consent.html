<!-- ====== GA4 + Google Consent Mode v2 (RGPD) ======
     Colar no <head> de TODAS as páginas, ANTES de qualquer outro script.
     Substituir G-XXXXXXXXXX pelo ID de medição do GA4.
     Nada é medido com cookies até o visitante aceitar (exigência RGPD / CNPD). -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied',
    analytics_storage: 'denied', wait_for_update: 500
  });
  try {
    if (localStorage.getItem('galeano_consent') === 'granted') {
      gtag('consent', 'update', { analytics_storage: 'granted' });
    }
  } catch (e) {}
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');

  // Eventos de conversão: marcação, chamada, WhatsApp, Instagram, mapa.
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a'); if (!a) return;
    var h = a.href || '';
    var local = a.closest('#ilhavo, [data-local="ilhavo"]') || /913456651|ilhavo/i.test(h) ? 'ilhavo'
              : (/234351054|927829171|studio316aveiro/i.test(h) ? 'aveiro' : 'geral');
    var ev = null;
    if (h.indexOf('koibox') > -1) ev = 'booking_click';
    else if (h.indexOf('tel:') === 0) ev = 'phone_click';
    else if (h.indexOf('wa.me') > -1) ev = 'whatsapp_click';
    else if (h.indexOf('instagram.com') > -1) ev = 'instagram_click';
    else if (/maps\.(app\.goo\.gl|google)|google\.com\/maps/.test(h)) ev = 'directions_click';
    if (ev) gtag('event', ev, { salon: local, link_url: h });
  });
</script>

<!-- ====== Banner de cookies (colar antes de </body>) ====== -->
<div id="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookies" hidden
     style="position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;max-width:560px;margin:auto;
            background:#2A2438;color:#fff;padding:16px 18px;border-radius:12px;font:14px/1.45 system-ui,sans-serif;
            box-shadow:0 8px 30px rgba(0,0,0,.3)">
  Usamos cookies de análise para melhorar o site. Pode aceitar ou recusar.
  <a href="/politica-cookies.html" style="color:#fff;text-decoration:underline">Saber mais</a>
  <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
    <button id="cookie-reject" style="padding:8px 14px;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer">Recusar</button>
    <button id="cookie-accept" style="padding:8px 14px;border-radius:8px;border:0;background:#fff;color:#2A2438;cursor:pointer;font-weight:600">Aceitar</button>
  </div>
</div>
<script>
  (function () {
    var b = document.getElementById('cookie-banner'), v = null;
    try { v = localStorage.getItem('galeano_consent'); } catch (e) {}
    if (!v) b.hidden = false;
    function set(val) {
      try { localStorage.setItem('galeano_consent', val); } catch (e) {}
      if (val === 'granted') gtag('consent', 'update', { analytics_storage: 'granted' });
      b.hidden = true;
    }
    document.getElementById('cookie-accept').onclick = function () { set('granted'); };
    document.getElementById('cookie-reject').onclick = function () { set('denied'); };
  })();
</script>
